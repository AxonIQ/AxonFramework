# Axon Framework 4 Sagas: kept running on the Axoniq commercial `axoniq-legacy`
# module (`io.axoniq.framework:axoniq-legacy`), with `SagaTestFixture` ported by
# `io.axoniq.framework:axoniq-legacy-test`. Free Axon Framework 5 has no Saga
# support, so this recipe only runs from `UpgradeAxon4ToAxoniq5`, through
# `Axon4ToAxoniq5Legacy`. It adds the dependencies it needs itself, so it can
# also run on its own.

---
type: specs.openrewrite.org/v1beta/recipe
name: io.axoniq.framework.migration.Axon4ToAxoniq5LegacySaga
displayName: Migrate Axon Framework 4 Sagas to Axoniq Framework 5
description: >-
  Keeps Axon Framework 4 Sagas running on the Axoniq Framework legacy module.
  Adds `io.axoniq.framework:axoniq-legacy` when Saga types or the Spring `@Saga`
  stereotype are used, and `io.axoniq.framework:axoniq-legacy-test` plus an
  `@AfterEach` tear-down when `SagaTestFixture` is used. Rewrites interceptor
  lambdas registered on the fixture to the Axon Framework 5 signature, and
  leaves a `TODO(axon4to5)` marker on fixture calls the ported fixture no longer
  supports, such as the scheduled event assertions. Replaces static
  `SagaLifecycle` calls with an injected `SagaLifecycle` handler parameter, a
  closing `SagaLifecycle.end()` of a `@DeadlineHandler` without an early
  `return` with `@EndSaga`, the other static `SagaLifecycle` calls of a
  `@DeadlineHandler` with `SagaLifecycle.forContext(processingContext)` calls on
  a `ProcessingContext` handler parameter, and
  a `CommandGateway` field, and the `@Autowired` or `@Inject` setter that only
  assigns it, with a `CommandDispatcher` handler parameter. Moves every other
  private field such a setter assigns, whatever its type, into a parameter of
  the handlers that use it, removing the field and the setter. Leaves a
  `TODO(axon4to5)` marker on static `SagaLifecycle` calls in other Saga methods,
  such as private helpers, which the legacy module cannot inject into. Leaves a
  `TODO(axon4to5)` marker on the other `@Autowired` or `@Inject` Saga fields
  and methods, such as the setter of a field no handler uses, on Spring
  `@Value` Saga fields, and on `ResourceInjector` usage, because Axon Framework
  5 resolves Saga collaborators as handler parameters instead of injecting
  them.
recipeList:
  # `onlyIfUsing` evaluates the AF4-typed source model before source rewrites run.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy
      version: ${axoniq.version}
      onlyIfUsing: org.axonframework.modelling.saga..*
  # A class may use only the Spring @Saga stereotype in a partially migrated source tree.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy
      version: ${axoniq.version}
      onlyIfUsing: org.axonframework.spring.stereotype.Saga

  # Saga tests keep their SagaTestFixture, which axoniq-legacy-test ports. The ported
  # fixture runs a live configuration and must be stopped after each test.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy-test
      version: ${axoniq.version}
      scope: test
      onlyIfUsing: org.axonframework.test.saga.SagaTestFixture
  - org.axonframework.migration.AddAxonTestFixtureTearDown:
      fixtureType: org.axonframework.test.saga.SagaTestFixture

  # The ported fixture takes Axon Framework 5 interceptors, also for
  # `registerEventHandlerInterceptor(..)`. Shared with the deadline recipe, which
  # needs it for the deadline interceptors; running it twice is a no-op.
  - org.axonframework.migration.MigrateLegacyFixtureInterceptorLambdas
  # Fixture calls the ported fixture no longer supports are kept and marked, never
  # removed: whether to delete a no-op or replace an unsupported assertion depends on
  # what the test meant to verify. Matched on the Axon Framework 4 fixture types,
  # which the free leg does not rename. `registerResourceInjector(..)` is left to
  # `MarkSagaResourceInjection` below.
  - org.axonframework.migration.MarkUnsupportedSagaTestFixtureCalls

  # Also covers static `SagaLifecycle` calls in `@DeadlineHandler` methods and
  # helpers, which the legacy module injects no `SagaLifecycle` into: a deadline
  # handler reaches it through its `ProcessingContext` instead, a helper is marked.
  - org.axonframework.migration.MigrateSagaLifecycle
  - org.axonframework.migration.MigrateCommandGatewayInSagaEventHandler
  # The legacy module calls no Saga setters, so a field an @Autowired or @Inject
  # setter only assigns would stay null. Without a type, this step moves every such
  # private field a method uses into a parameter of the handlers (and the private
  # helpers they call) that use it, and removes the field and the setter. The
  # parameter is declared like the setter's, so it resolves the same component or,
  # with Spring, the same bean. Runs after the CommandGateway migration, which
  # turns that field into a CommandDispatcher parameter instead. A field no method
  # uses keeps its setter, as does a setter whose bean a handler parameter may not
  # receive, such as one with `@Qualifier` on the method or `required = false`.
  - org.axonframework.migration.MoveSagaFieldToHandlerParameter
  # Runs after the steps above, which already turned the CommandGateway field and
  # the used setter-injected fields into handler parameters, so only the remaining
  # injected fields and setters are marked.
  - org.axonframework.migration.MarkSagaResourceInjection
