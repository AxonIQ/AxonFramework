# Axon Framework 4 Sagas: kept running on the Axoniq commercial `axoniq-legacy`
# module (`io.axoniq.framework:axoniq-legacy`), with `SagaTestFixture` ported by
# `io.axoniq.framework:axoniq-legacy-test`. Free Axon Framework 5 has no Saga
# support, so this recipe only runs from `UpgradeAxon4ToAxoniq5`, through
# `Axon4ToAxoniq5Legacy`. It adds the dependencies it needs itself, so it can
# also run on its own.

---
type: specs.openrewrite.org/v1beta/recipe
name: io.axoniq.framework.migration.Axon4ToAxoniq5LegacySaga
displayName: Migrate Axon Framework 4 Sagas to Axoniq Framework 5
description: >-
  Keeps Axon Framework 4 Sagas running on the Axoniq Framework legacy module.
  Adds `io.axoniq.framework:axoniq-legacy` when Saga types or the Spring `@Saga`
  stereotype are used, and `io.axoniq.framework:axoniq-legacy-test` plus an
  `@AfterEach` tear-down when `SagaTestFixture` is used. Replaces static
  `SagaLifecycle` calls with an injected `SagaLifecycle` handler parameter, and
  a `CommandGateway` field with a `CommandDispatcher` handler parameter.
recipeList:
  # `onlyIfUsing` evaluates the AF4-typed source model before source rewrites run.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy
      version: ${axoniq.version}
      onlyIfUsing: org.axonframework.modelling.saga..*
  # A class may use only the Spring @Saga stereotype in a partially migrated source tree.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy
      version: ${axoniq.version}
      onlyIfUsing: org.axonframework.spring.stereotype.Saga

  # Saga tests keep their SagaTestFixture, which axoniq-legacy-test ports. The ported
  # fixture runs a live configuration and must be stopped after each test.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy-test
      version: ${axoniq.version}
      scope: test
      onlyIfUsing: org.axonframework.test.saga.SagaTestFixture
  - org.axonframework.migration.AddAxonTestFixtureTearDown:
      fixtureType: org.axonframework.test.saga.SagaTestFixture

  - org.axonframework.migration.MigrateSagaLifecycle
  - org.axonframework.migration.MigrateCommandGatewayInSagaEventHandler
