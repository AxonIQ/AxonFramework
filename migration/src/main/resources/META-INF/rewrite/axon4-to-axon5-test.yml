# Test module (axon-test) renames.

---
type: specs.openrewrite.org/v1beta/recipe
name: org.axonframework.migration.Axon4ToAxon5Test
displayName: Apply Axon Framework 5 test module renames
description: >-
  Renames `AggregateTestFixture` to the unified `AxonTestFixture` introduced
  in Axon Framework 5 (`SagaTestFixture` stays, ported by `axoniq-legacy-test`),
  and rewrites AF4-style
  flat fixture call chains (`fixture.given(...).when(...).expectEvents(...)`)
  to the AF5 fluent given/when/then API
  (`fixture.given().events(...).when().command(...).then().events(...)`).
  Also generates an `@AfterEach tearDown()` calling `fixture.stop()` on
  test classes that declare an `AxonTestFixture` field but have no
  existing `@AfterEach`. Targets the `axon-test` Maven artifact. Hamcrest
  matcher conversions and Kotlin `@AfterEach` insertion remain manual.
  `AxonTestFixture` has no deadline manager and no clock, so the aggregate
  fixture's deadline assertions, time calls and deadline interceptor
  registrations are kept and marked with a `TODO(axon4to5)` comment.
recipeList:
  # `AxonTestFixture` has no deadline manager and no clock, so the aggregate
  # fixture's deadline assertions, time travel and deadline interceptors are kept
  # and marked. Runs first, while the calls still resolve to the AF4
  # `org.axonframework.test.aggregate` types, and before the fluent-API rewrite
  # rebuilds their chains; the marker sits on the statement, which that rewrite
  # keeps. The commercial `Axon4ToAxoniq5LegacyDeadline` runs the same recipe
  # earlier with its own wording, which this step then leaves in place.
  - org.axonframework.migration.MarkAggregateTestFixtureDeadlineCalls
  # Aggregate-fixture *setup* rewrite — must run BEFORE the
  # `AggregateTestFixture` → `AxonTestFixture` `ChangeType` below so the AF4
  # type is still on the constructor expression. SagaTestFixture constructor
  # sites are never touched: that type is not renamed.
  # Reads the aggregate-id type from the cross-recipe map populated by
  # `AddEventTagAnnotation` while `@AggregateIdentifier` is still on the source.
  - org.axonframework.migration.MigrateAggregateTestFixtureSetup
  # Type rename — must run BEFORE the fluent-API rewrite so subsequent matchers
  # see the new `AxonTestFixture` type, and so the import is updated in one
  # cycle even when the call-chain rewrite doesn't fire.
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.axonframework.test.aggregate.AggregateTestFixture
      newFullyQualifiedTypeName: org.axonframework.test.fixture.AxonTestFixture
  # `SagaTestFixture` is NOT renamed: `axoniq-legacy-test` ports it for sagas that
  # keep running on `axoniq-legacy`. `Axon4ToAxoniq5LegacySaga`, run by the commercial
  # `UpgradeAxon4ToAxoniq5`, adds that dependency and the `@AfterEach` tear-down the
  # ported fixture needs.
  # The command callback behaviour moved from `org.axonframework.test.utils` to
  # `org.axonframework.test.util` with the same shape (its `MetaData` parameter
  # follows the messaging rename). Only these two move one to one: the AF4
  # `RecordingCommandBus` and `AutowiredResourceInjector` of that package have no
  # same-shaped AF5 counterpart. `SagaTestFixture.setCallbackBehavior(..)`, ported
  # by `axoniq-legacy-test`, takes the AF5 type.
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.axonframework.test.utils.CallbackBehavior
      newFullyQualifiedTypeName: org.axonframework.test.util.CallbackBehavior
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.axonframework.test.utils.DefaultCallbackBehavior
      newFullyQualifiedTypeName: org.axonframework.test.util.DefaultCallbackBehavior
  # FixtureConfiguration<T> is the interface type used as variable declarations
  # in many AF4 tests (e.g. `FixtureConfiguration<Dwelling> fixture`).
  # AF5 replaces it with the concrete AxonTestFixture — no type argument.
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.axonframework.test.aggregate.FixtureConfiguration
      newFullyQualifiedTypeName: org.axonframework.test.fixture.AxonTestFixture
  # AF5's AxonTestFixture is non-generic — drop the `<T>` payload parameter that
  # AF4 used on AggregateTestFixture / FixtureConfiguration so
  # call sites like `AxonTestFixture<Order>` collapse to a raw `AxonTestFixture`.
  - org.axonframework.migration.RemoveTypeArguments:
      fullyQualifiedTypeName: org.axonframework.test.fixture.AxonTestFixture
  # Fluent-API rewrite — handles the call-chain shape change documented in
  # `paths/test-fixtures.adoc`. Leaves Hamcrest-matcher methods alone.
  - org.axonframework.migration.MigrateAxonTestFixtureFluentApi
  # Tear-down generation — adds `@AfterEach tearDown() { fixture.stop(); }`
  # to test classes that declare an `AxonTestFixture` field but have no
  # existing `@AfterEach`. Must run AFTER the `ChangeType` passes above so
  # the field already carries the AF5 FQN that this recipe matches.
  # Conservative: skips classes that already have any `@AfterEach` or any
  # method named `tearDown`. Java sources only.
  - org.axonframework.migration.AddAxonTestFixtureTearDown
