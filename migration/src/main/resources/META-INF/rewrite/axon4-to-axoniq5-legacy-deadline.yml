# Axon Framework 4 deadlines: `DeadlineManager`, `@DeadlineHandler` and the
# deadline test fixtures, kept running on the Axoniq commercial `axoniq-legacy`
# module (`io.axoniq.framework:axoniq-legacy`) and its test fixtures
# (`io.axoniq.framework:axoniq-legacy-test`). The deadline types keep their
# Axon Framework 4 packages there, so the recipe changes call sites only where
# Axon Framework 5 forces it. Free Axon Framework 5 has no deadline support, so
# this recipe only runs from `UpgradeAxon4ToAxoniq5`, through
# `Axon4ToAxoniq5Legacy`. It adds the dependencies it needs itself, so it can
# also run on its own.

---
type: specs.openrewrite.org/v1beta/recipe
name: io.axoniq.framework.migration.Axon4ToAxoniq5LegacyDeadline
displayName: Migrate Axon Framework 4 deadlines to Axoniq Framework 5
description: >-
  Keeps Axon Framework 4 deadlines running on the Axoniq Framework legacy
  module. Adds `io.axoniq.framework:axoniq-legacy` when deadline types are used,
  and `io.axoniq.framework:axoniq-legacy-test` when the deadline test fixtures
  are used.
recipeList:
  # `onlyIfUsing` evaluates the AF4-typed source model before source rewrites run.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy
      version: ${axoniq.version}
      onlyIfUsing: org.axonframework.deadline..*
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.axoniq.framework
      artifactId: axoniq-legacy-test
      version: ${axoniq.version}
      scope: test
      onlyIfUsing: org.axonframework.test.deadline..*

  # ── Sagas ──────────────────────────────────────────────────────────────────

  # The legacy module does not inject Saga fields, so an @Autowired or @Inject
  # DeadlineManager field would stay null. Every schedule and cancel overload is
  # kept, so only the collaborator moves: into a parameter of the handlers (and
  # the private helpers they call) that use it. Runs before the Saga recipe, whose
  # closing MarkSagaResourceInjection then only marks the fields left in place.
  - org.axonframework.migration.MoveSagaFieldToHandlerParameter:
      fullyQualifiedTypeName: org.axonframework.deadline.DeadlineManager

  # ── Aggregates ─────────────────────────────────────────────────────────────

  # An aggregate deadline fires as a command on the legacy module, so its
  # @DeadlineHandler becomes the Axon Framework 4 @CommandHandler receiving
  # that command. It must run before the free leg, which then moves that
  # annotation to the Axon Framework 5 package and migrates the handler like
  # any other aggregate command handler.
  - org.axonframework.migration.MigrateAggregateDeadlineHandler
  # Only a Saga handler runs inside a scope in Axon Framework 5, so the
  # DeadlineManager calls of an aggregate that relied on its scope get the
  # AggregateScopeDescriptor Axon Framework 4 described. It must run before
  # the free leg removes @AggregateIdentifier, which names the identifier,
  # and turns creation constructors into static methods. The free leg's
  # modelling.command package move is undone for AggregateScopeDescriptor
  # in UpgradeAxon4ToAxoniq5, as axoniq-legacy keeps it in that package.
  - org.axonframework.migration.AddAggregateScopeToDeadlineCalls

  # ── Deadline manager configuration ─────────────────────────────────────────

  # The legacy deadline manager builders dropped spanFactory(..), transactionManager(..)
  # and serializer(..), and require unitOfWorkFactory(..) and, when persistent,
  # converter(..). Runs before the free leg renames org.axonframework.serialization,
  # so the AF4 JacksonSerializer it maps is still recognizable.
  - org.axonframework.migration.MigrateDeadlineManagerBuilders

  # ConfigurationScopeAwareProvider is not ported; the legacy module registers its own
  # ScopeAwareProvider component. Configuration#deadlineManager(), configureDeadlineManager(..)
  # and interceptor registration on the DeadlineManager interface are gone too. Runs before
  # the free leg moves org.axonframework.config, while the AF4 types still resolve.
  - org.axonframework.migration.MigrateDeadlineManagerConfiguration
  # Retypes what still names the removed class, such as a variable or @Bean return type,
  # after the step above replaced its construction.
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.axonframework.config.ConfigurationScopeAwareProvider
      newFullyQualifiedTypeName: org.axonframework.messaging.ScopeAwareProvider

  # ── Test fixtures ──────────────────────────────────────────────────────────
  # The legacy DeadlineMessage and GenericDeadlineMessage keep their Axon Framework 4
  # package but dropped the payload type parameter, like every Axon Framework 5
  # message. Production code is affected as much as tests (a `DeadlineMessage<?>`
  # handler parameter, a `new GenericDeadlineMessage<>(..)`); the step sits here
  # because the fixture matchers and interceptors are where the type arguments
  # cluster, e.g. `Matcher<? super DeadlineMessage<?>>`. Matched on the unchanged
  # Axon Framework 4 type names, so the position in the leg does not matter.
  - org.axonframework.migration.RemoveTypeArguments:
      fullyQualifiedTypeName: org.axonframework.deadline.DeadlineMessage
  - org.axonframework.migration.RemoveTypeArguments:
      fullyQualifiedTypeName: org.axonframework.deadline.GenericDeadlineMessage
  # The ported SagaTestFixture and StubDeadlineManager take Axon Framework 5
  # interceptors, so the Axon Framework 4 interceptor lambdas registered on them
  # stop compiling. Runs here, on the Axon Framework 4 types, before the free leg
  # renames the interceptor types; the rewritten lambdas keep the types of the
  # message calls they hold, so the free leg's method renames (`getTimestamp()`,
  # `andMetaData(..)`) still apply to them. The Saga recipe lists it too, for the
  # Saga event handler interceptors; running it twice is a no-op.
  - org.axonframework.migration.MigrateLegacyFixtureInterceptorLambdas
