# Axoniq Framework legacy module (`io.axoniq.framework:axoniq-legacy` and
# `io.axoniq.framework:axoniq-legacy-test`): Axon Framework 4 APIs that Axoniq
# Framework 5 keeps running. Composes one child recipe per ported feature; each
# child adds the legacy dependencies it needs, so it can also run on its own.

---
type: specs.openrewrite.org/v1beta/recipe
name: io.axoniq.framework.migration.Axon4ToAxoniq5Legacy
displayName: Migrate Axon Framework 4 legacy APIs to Axoniq Framework 5
description: >-
  Migrates the Axon Framework 4 APIs that the Axoniq Framework legacy modules
  `io.axoniq.framework:axoniq-legacy` and `io.axoniq.framework:axoniq-legacy-test`
  keep running. Today that covers Sagas.
recipeList:
  - io.axoniq.framework.migration.Axon4ToAxoniq5LegacySaga
