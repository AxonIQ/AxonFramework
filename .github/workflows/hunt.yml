name: Axon Hunt

# The bug-hunting suite. Only the smoke tier runs here: a small workload, a fixed set of seeds, and at most one
# injected fault at a time, so that a red build points at one cause rather than at four candidates. The long seed
# sweeps and the fault storms belong to the scheduled jobs stubbed at the bottom of this file.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  # The seed sweep every night and the container tiers once a week. Both jobs gate themselves on the event being a
  # schedule or a dispatch rather than a pull request, so a per-change build never pays for them.
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hunt-smoke:
    name: Hunt smoke on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    # The smoke tier is budgeted to finish in well under ten minutes. The cap is a guard against a wedged run, not a
    # target: a run that needs more than this has stopped being a per-change gate.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21, 25 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"

      # Every test in the module is judged by an oracle over a recorded history, and a rerun hides exactly the
      # intermittent break the suite exists to surface. The module pins the count to zero in its own POM; this step
      # asserts that rather than trusting it, because a pin nobody checks is a pin that silently disappears.
      - name: Assert reruns are pinned off
        run: |
          grep -q '<surefire.rerunFailingTestsCount>0</surefire.rerunFailingTestsCount>' simulation/pom.xml \
            || { echo "The hunt module no longer pins surefire.rerunFailingTestsCount to 0."; exit 1; }
          ! grep -rn 'rerunFailingTestsCount' .github/workflows/hunt.yml | grep -v 'simulation/pom.xml' \
            | grep -q -- '-D' \
            || { echo "This workflow must never pass a rerun count on the command line."; exit 1; }

      # The upstream modules are built without their tests: the regular pull-request build already runs those, and
      # running them twice would push this job past the budget that makes it a per-change gate.
      - name: Build the framework the suite drives
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Djacoco.skip=true -pl eventsourcing -am clean install -DskipTests

      - name: Hunt smoke tier
        run: |
          ./mvnw -B -ntp -Dstyle.color=always -Djacoco.skip=true -Phunt -pl simulation test

      # A failure whose history is gone is a failure nobody can act on. Under real threads a seed does not reproduce
      # the run that broke, so the recorded history is the only exact record of it and has to survive the runner.
      - name: Archive recorded histories
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hunt-histories-jdk${{ matrix.java-version }}
          path: '**/target/hunt-histories/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "simulation/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always() # This allows the build step to fail -- due to failing tests -- but still produce a test summary.

  # The seed sweep. Nightly rather than per-change because it is measured in seeds and not in minutes: the smoke tier
  # runs a fixed handful so that a red build points at one cause, and this one runs enough of them to find the
  # interleaving nobody thought of. Chunked across a matrix so that no single virtual machine outlives the runner, and
  # each chunk starts where the previous one stopped, so the sweep covers a contiguous range rather than the same seeds
  # from four directions.
  hunt-fuzz:
    name: Hunt fuzz seeds ${{ matrix.start-seed }}
    # Nightly, or on demand. Never on a pull request: the sweep is measured in seeds and would stop being a gate.
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        start-seed: [ 10000, 11000, 12000, 13000 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: 21
          cache: "maven"

      - name: Assert reruns are pinned off
        run: |
          grep -q '<surefire.rerunFailingTestsCount>0</surefire.rerunFailingTestsCount>' simulation/pom.xml \
            || { echo "The hunt module no longer pins surefire.rerunFailingTestsCount to 0."; exit 1; }

      - name: Build the framework the suite drives
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Djacoco.skip=true -pl eventsourcing -am clean install -DskipTests

      # The fuzz tag is excluded from every normal build, so the sweep has to clear the exclusion explicitly. Nothing
      # here passes a rerun count: a seed that fails once has found something, and running it again until it passes is
      # how a suite is taught to hide its own findings.
      - name: Hunt fuzz tier
        run: |
          ./mvnw -B -ntp -Dstyle.color=always -Djacoco.skip=true -Phunt -pl simulation test \
            -Dhunt.excludedGroups= -Dtest=HuntFuzzTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dhunt.seeds=250 -Dhunt.startSeed=${{ matrix.start-seed }}

      # Always, not only on failure. A sweep's histories are the only exact record of the runs it made -- under real
      # threads a seed does not reproduce the run that broke -- and a clean sweep's histories are what the next
      # regression is compared against.
      - name: Archive recorded histories
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-histories-fuzz-${{ matrix.start-seed }}
          path: '**/target/hunt-histories/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "simulation/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always()

  # The container tiers: the backend differential and the arms that break a real store's machinery. Weekly rather than
  # nightly because every arm of it starts containers and kills them, which is minutes of wall clock per arm and cannot
  # be made cheap. Split into two jobs rather than one, because a differential that compares stores and a nemesis that
  # destroys one are different failures to read: a red differential names a store, a red chaos arm names a fault.
  hunt-chaos:
    name: Hunt containers -- ${{ matrix.arm }}
    # Weekly, or on demand. Every arm starts containers and kills them, which is minutes of wall clock each.
    if: github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same scenarios against every store the suite can reach, so that a failure names the store rather than
          # starting an argument about whose defect it is.
          - arm: backend-differential
            test: BackendDifferentialTest
          # Faults that act on the infrastructure rather than on a wrapper: the network cut with the store left running,
          # the process killed outright, and the commits held open past the store's own gap timeout.
          - arm: store-infrastructure-failures
            test: StoreInfrastructureFailureTest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: 21
          cache: "maven"

      - name: Assert reruns are pinned off
        run: |
          grep -q '<surefire.rerunFailingTestsCount>0</surefire.rerunFailingTestsCount>' simulation/pom.xml \
            || { echo "The hunt module no longer pins surefire.rerunFailingTestsCount to 0."; exit 1; }

      # The images every container arm needs, pulled up front so that a pull failure is reported as a pull failure
      # rather than as a scenario whose nemesis mysteriously never landed.
      - name: Pull the images the container arms need
        run: |
          docker pull postgres:16-alpine
          docker pull ghcr.io/shopify/toxiproxy:2.12.0

      - name: Build the framework the suite drives
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Djacoco.skip=true -pl eventsourcing -am clean install -DskipTests

      # Only the fuzz tag stays excluded: the container tag is what this job exists to clear. No rerun count, for the
      # same reason as everywhere else in this file.
      - name: Hunt container tier -- ${{ matrix.arm }}
        run: |
          ./mvnw -B -ntp -Dstyle.color=always -Djacoco.skip=true -Phunt -pl simulation test \
            -Dhunt.excludedGroups=fuzz -Dtest=${{ matrix.test }} -Dsurefire.failIfNoSpecifiedTests=false

      # Always. A chaos arm's history carries the landing evidence for its nemesis -- the exit code, the recovery line,
      # the proxy's reported state -- and a run without that evidence is inconclusive rather than a pass, so the
      # evidence has to survive the runner whichever way the run went.
      - name: Archive recorded histories
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-histories-${{ matrix.arm }}
          path: '**/target/hunt-histories/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "simulation/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always()

