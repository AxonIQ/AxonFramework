name: Axon Framework (Pull Request)

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
            # disable sonar for now
            sonar-enabled: false
          - java-version: 25
            sonar-enabled: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Regular Build
        if: ${{ !matrix.sonar-enabled }}
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh -Pintegration-test -Djacoco.skip=true clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2 &
          MVN_PID=$!

          # Watchdog: the job has a 30m hard timeout that cancels everything with zero
          # diagnostics. If the build is still running well past when it should finish,
          # dump thread stacks of every JVM so a hang (e.g. a forked test JVM that never
          # exits) is diagnosable from the run log instead of a silent cancellation.
          (
            sleep 1080
            if kill -0 "$MVN_PID" 2>/dev/null; then
              echo "::warning::Build still running after 18m - dumping thread stacks for diagnosis"
              for p in $(jps -q); do
                echo "--- Thread dump for pid $p ---"
                jstack -l "$p" 2>&1 || jcmd "$p" Thread.print 2>&1 || true
              done
              sleep 300
              if kill -0 "$MVN_PID" 2>/dev/null; then
                echo "::error::Build still stuck 5m after diagnosis - killing to fail fast"
                kill -9 "$MVN_PID" 2>/dev/null || true
              fi
            fi
          ) &
          WATCHDOG_PID=$!

          wait "$MVN_PID"
          MVN_EXIT=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit "$MVN_EXIT"

      - name: Build with Coverage reports
        if: matrix.sonar-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh -Dcoverage clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2

      - name: Sonar Analysis
        if: ${{ success() && matrix.sonar-enabled && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          ./mvnw -B -ntp -Dstyle.color=always org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=AxonIQ_AxonFramework \
          -Dsonar.organization=axoniq \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "**/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always() # This allows the build step to fail -- due to failing tests -- but still produce a test summary.