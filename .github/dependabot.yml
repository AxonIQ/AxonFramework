version: 2

updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  milestone: 142
  groups:
    github-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"

- package-ecosystem: maven
  directories:
    - "/"
    - "!/examples/university-java-springboot-4"
    - "!/extensions/spring/spring-boot-compatibility-tests/spring-boot-4"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  milestone: 142
  groups:
    maven-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"
  ignore:
    - dependency-name: "org.springframework:*"
      versions: [ "[7.0.0,)" ]
    - dependency-name: "org.springframework.security:*"
      versions: [ "[7.0.0,)" ]
    - dependency-name: "org.springframework.boot:*"
      versions: [ "[4.0.0,)" ]
    - dependency-name: "org.springdoc:*"
      versions: [ "[3.0.0,)" ]
    - dependency-name: "org.springframework.data:*"
      versions: [ "[2025.0.0,)" ]
    - dependency-name: "org.openrewrite.recipe:*"
      versions: [ "[3.37.0,)" ]
    - dependency-name: "org.apache.maven:apache-maven"
      versions: [ "3.10.0" ]


- package-ecosystem: maven
  directory: "/examples/university-java-springboot-4"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  milestone: 142
  groups:
    maven-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"

# Excluded from the general "/" maven entry above (which ignores Spring Boot 4.x) so this Spring Boot 4
# compatibility module's default version keeps getting bumped to new Spring Boot 4 patch/minor releases on
# its own cadence. The spring-boot-compatibility CI workflow additionally tests other 4.x versions directly via
# -Dspring.boot.version overrides in its matrix, independent of what this module's pom.xml defaults to.
- package-ecosystem: maven
  directory: "/extensions/spring/spring-boot-compatibility-tests/spring-boot-4"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  milestone: 142
  groups:
    maven-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"

- package-ecosystem: npm
  directory: "/docs/_playbook"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  milestone: 142
  groups:
    antora-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"
  ignore:
    # asciidoctor-kroki 1.x and 2.x require Asciidoctor.js 4 (and 2.x requires Node 22+), but Antora 3.x
    # bundles Asciidoctor.js 2.2. Stay on the 0.x line until Antora ships on Asciidoctor.js 4.
    - dependency-name: "asciidoctor-kroki"
      versions: [">=1.0.0"]
