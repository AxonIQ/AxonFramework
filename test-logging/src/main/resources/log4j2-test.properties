# Default test logging configuration for all Axon Framework modules.
#
# Named "log4j2-test.properties" (rather than "log4j2.properties") so it takes
# precedence, per Log4j2's ConfigurationFactory search order, over any
# "log4j2.properties" that might still be bundled in another module's test-jar.
#
# Policy: dependencies default to ERROR, Axon Framework code defaults to WARN,
# with specific known-noisy loggers pinned to ERROR/OFF, and specific loggers
# that tests rely on capturing at a finer level pinned back up.
#
# This replaces 9 separate, drifted log4j2.properties files that used to live
# in messaging, modelling, eventsourcing, test, integrationtests, and four
# extension modules. Several of their per-class overrides referenced classes
# that no longer exist (renamed or removed over the course of the Axon 5
# refactor) and were silently doing nothing; those were dropped rather than
# carried forward. Only overrides verified against current source were kept.

name=AxonTestConfiguration

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %-30.30logger{1} - %msg%n

# Dependencies default to ERROR
rootLogger.level = ERROR
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

# Axon Framework code defaults to WARN
logger.axon.name = org.axonframework
logger.axon.level = WARN
logger.axon.additivity = false
logger.axon.appenderRefs = stdout
logger.axon.appenderRef.stdout.ref = STDOUT

# SnapshottingEntityLifecycleHandlerTest(Suite) attach a ListAppender to this
# logger and assert on its INFO-level messages; the WARN default above would
# otherwise filter them out before the appender sees them.
logger.snapshotting-entity-lifecycle-handler.name = org.axonframework.eventsourcing.handler.SnapshottingEntityLifecycleHandler
logger.snapshotting-entity-lifecycle-handler.level = INFO

# Known-noisy Axon Framework classes, narrowed further than the WARN default
logger.shutdown-latch.name = org.axonframework.common.lifecycle.ShutdownLatch
logger.shutdown-latch.level = ERROR
logger.default-command-gateway.name = org.axonframework.messaging.commandhandling.gateway.DefaultCommandGateway
logger.default-command-gateway.level = ERROR
logger.spring-bean-parameter-resolver.name = org.axonframework.extension.spring.config.annotation.SpringBeanParameterResolverFactory
logger.spring-bean-parameter-resolver.level = ERROR
logger.deep-equals-matcher.name = org.axonframework.test.matchers.DeepEqualsMatcher
logger.deep-equals-matcher.level = ERROR
logger.simple-query-update-emitter.name = org.axonframework.messaging.queryhandling.SimpleQueryUpdateEmitter
logger.simple-query-update-emitter.level = OFF
logger.in-memory-token-store.name = org.axonframework.messaging.eventhandling.processing.streaming.token.store.inmemory.InMemoryTokenStore
logger.in-memory-token-store.level = ERROR
logger.work-package.name = org.axonframework.messaging.eventhandling.processing.streaming.pooled.WorkPackage
logger.work-package.level = ERROR
logger.springboot-util.name = org.axonframework.extension.springboot.util
logger.springboot-util.level = ERROR
