spring:
  datasource:
    url: jdbc:h2:mem:saga-recipes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
axon:
  converter:
    general: jackson
  axonserver:
    enabled: true
saga:
  recipe: injectentity
  deadline:
    sweep-interval: PT5S
