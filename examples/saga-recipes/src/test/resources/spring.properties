# Spring Framework 7 pauses a cached test context when the test run switches to a different one, and restarts it
# when it is used again. Restarting re-runs every SmartLifecycle bean, and Axon's start-up lifecycle re-registers its
# handlers, so the second start fails with:
#
#   DuplicateCommandHandlerSubscriptionException: Duplicate subscription for command [...]
#
# This module has six test contexts, one per saga recipe plus a default with none active, so it switches between them
# constantly and hits this immediately. Turning pausing off is a workaround, not a fix: Axon's Spring lifecycle should
# be safe to restart. Anything combining Axon with Spring Boot 4 and more than one test context will need this until
# it is.
#
# Read by SpringProperties, which is why this lives in spring.properties rather than in application.yml.
spring.test.context.cache.pause=NEVER
