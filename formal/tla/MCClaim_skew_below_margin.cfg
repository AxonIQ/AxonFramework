\* A skew of 2 ticks against a claim timeout of 5 and a refresh interval of 1.
\* The measured claim is that a skew below the margin between the claim timeout
\* and the refresh interval -- here 4 ticks -- cannot make a live row look
\* expired.  This run tests that claim with the refresh NOT guaranteed, which is
\* what a scheduled thread on a loaded machine gives you.
\* EXPECT: AtMostOneSegmentOwner VIOLATED.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    SkewedNode = n2
    SKEW = 2
    CLAIM_TIMEOUT = 5
    REFRESH_INTERVAL = 1
    SKEW_ALLOWANCE = 0
    MaxTime = 10
    MaxCrashes = 0
    GUARANTEED_REFRESH = FALSE

INVARIANT TypeOK
INVARIANT AtMostOneSegmentOwner
