\* The same skew with the refresh guaranteed: the clock may not advance past the
\* point at which a running owner owes a refresh, so no row is ever older than
\* the refresh interval.  This is the modelled fix, and it is the condition the
\* measured bound needs attached to it.
\* EXPECT: No error.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    SkewedNode = n2
    SKEW = 2
    CLAIM_TIMEOUT = 5
    REFRESH_INTERVAL = 1
    SKEW_ALLOWANCE = 0
    MaxTime = 10
    MaxCrashes = 0
    GUARANTEED_REFRESH = TRUE

INVARIANT TypeOK
INVARIANT AtMostOneSegmentOwner
