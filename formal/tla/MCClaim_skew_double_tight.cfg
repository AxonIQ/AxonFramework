\* The same run with the forgiven overlap one tick below the claim timeout.  It
\* is the tightness half of the run above: without it, "the overlap saturates at
\* one claim timeout" would be an upper bound nothing shows is reached.
\* EXPECT: AtMostOneSegmentOwner VIOLATED, at an overlap of exactly the claim
\* timeout.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    SkewedNode = n2
    SKEW = 10
    CLAIM_TIMEOUT = 5
    REFRESH_INTERVAL = 1
    SKEW_ALLOWANCE = 4
    MaxTime = 10
    MaxCrashes = 0
    GUARANTEED_REFRESH = FALSE

INVARIANT TypeOK
INVARIANT AtMostOneSegmentOwner
