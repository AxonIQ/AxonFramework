\* A skew of twice the claim timeout, with the overlap forgiven set to one claim
\* timeout.  The skewed node considers every row in the store stealable at every
\* moment, but the loser's own claim still lapses one timeout after its last
\* refresh however far ahead the thief's clock reads, because the skew shifts the
\* comparison and not the timestamp.  So the overlap saturates at one timeout
\* instead of growing with the skew.
\* EXPECT: No error.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    SkewedNode = n2
    SKEW = 10
    CLAIM_TIMEOUT = 5
    REFRESH_INTERVAL = 1
    SKEW_ALLOWANCE = 5
    MaxTime = 10
    MaxCrashes = 0
    GUARANTEED_REFRESH = FALSE

INVARIANT TypeOK
INVARIANT AtMostOneSegmentOwner
