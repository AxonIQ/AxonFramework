\* Liveness, under fairness on the clock and on claiming, with one crash allowed.
\* A segment whose owner is not running must be claimed by a node that is, within
\* the model's horizon.  Clocks are in step here: the question is whether a lost
\* process wedges a segment, not whether skew widens an overlap.
\* EXPECT: No error.
SPECIFICATION FairSpec

CONSTANTS
    Nodes = {n1, n2}
    SkewedNode = n2
    SKEW = 0
    CLAIM_TIMEOUT = 5
    REFRESH_INTERVAL = 1
    SKEW_ALLOWANCE = 0
    MaxTime = 12
    MaxCrashes = 1
    GUARANTEED_REFRESH = FALSE

INVARIANT TypeOK
PROPERTY ClaimEventuallyAvailable
