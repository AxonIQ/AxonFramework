\* Over-acceptance, checked on the divergent engine.  The marker collapse makes
\* the aggregate-based engine reject appends the protocol permits; the question
\* this run settles is whether it also accepts any the protocol forbids.
\* EXPECT: No error -- the divergence is over-rejection only.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Events <- MCEvents
    Boundaries <- MCBoundaries
    Batches <- MCBatches
    MaxLen = 3
    INFINITY_IS_ORIGIN = TRUE

INVARIANT TypeOK
INVARIANT AppendIsLegalIffNoMatchInScanRange
INVARIANT CommitMarkerNeverRegresses
