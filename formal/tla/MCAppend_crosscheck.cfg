\* Emits one line per case of the append decision over the finite domain, for
\* replay through the Java reference model.  Not an invariant run: the output is
\* the product.  See README.md, "Cross-check".
SPECIFICATION CSpec

CONSTANTS
    Writers = {w1, w2}
    Events <- MCEvents
    Boundaries <- MCBoundaries
    Batches <- MCBatches
    MaxLen = 3
    INFINITY_IS_ORIGIN = FALSE

INVARIANT ProbeTypeOK
