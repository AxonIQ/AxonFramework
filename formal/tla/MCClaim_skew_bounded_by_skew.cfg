\* The same skew, with the overlap the run forgives set equal to the skew.  A
\* node reading delta ahead can take a claim at most delta before it would have
\* lapsed anyway, so the overlap can never exceed delta.  That is a prediction,
\* and this run is where it is judged rather than asserted.
\* EXPECT: No error.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    SkewedNode = n2
    SKEW = 2
    CLAIM_TIMEOUT = 5
    REFRESH_INTERVAL = 1
    SKEW_ALLOWANCE = 2
    MaxTime = 10
    MaxCrashes = 0
    GUARANTEED_REFRESH = FALSE

INVARIANT TypeOK
INVARIANT AtMostOneSegmentOwner
