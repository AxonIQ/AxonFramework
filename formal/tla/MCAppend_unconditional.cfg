\* An unconditional append against an engine that resolves ORIGIN and INFINITY
\* to the same thing (INFINITY_IS_ORIGIN = TRUE).  Such an engine scans the
\* whole store for an append that asked for no consistency at all, so a stored
\* event the boundary matches rejects it.
\* EXPECT: UnconditionalAppendNeverRejected VIOLATED.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Events <- MCEvents
    Boundaries <- MCBoundaries
    Batches <- MCBatches
    MaxLen = 3
    INFINITY_IS_ORIGIN = TRUE

INVARIANT TypeOK
INVARIANT UnconditionalAppendNeverRejected
